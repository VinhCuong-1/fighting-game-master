name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript (ESLint)
        run: npx eslint . || echo "No lint errors"

      - name: Run simple build check (ensure project loads)
        run: |
          npm run build || echo "No build script defined, skip"
